name: EIA Harvester
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: EIA monthly retail
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_eia.py
      - name: EIA hourly RTO
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_eia_hourly.py
      - name: EIA daily RTO (load history 10y)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_eia_daily.py || echo "skip fetch_eia_daily"
      - name: FX rates (ECB, no key)
        run: python fetch_fx.py
      - name: FX history (ECB timeseries, no key)
        run: python fetch_fx_history.py
      - name: PJM discover (log only, keep going on failure)
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: python fetch_pjm_v2.py --discover
      - name: PJM DA LMP via API v2
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: python fetch_pjm_v2.py || echo "skip fetch_pjm_v2"
      - name: PJM DA LMP via API (legacy)
        env:
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: python fetch_pjm.py || echo "skip fetch_pjm"
      - name: PJM DA LMP via manual CSV
        run: python aggregate_pjm_csv.py || echo "skip aggregate_pjm_csv"
      - name: MISO DA LMP (monthly, keyless)
        run: python fetch_miso.py
      - name: EIA STEO forward (Henry Hub)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_steo.py || echo "skip fetch_steo"
      - name: build panel (all sources -> panel_monthly.csv)
        run: python build_panel.py || echo "skip build_panel"
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eia-result
          if-no-files-found: ignore
          path: |
            eia_industrial_prices_monthly.json
            eia_industrial_prices_monthly.csv
            eia_hourly_rto.json
            eia_hourly_rto.csv
            eia_rto_monthly.csv
            eia_rto_monthly.json
            fx_krw.json
            fx_krw.csv
            fx_krw_daily.csv
            fx_krw_monthly.csv
            fx_krw_history.json
            pjm_lmp_monthly.json
            pjm_lmp_monthly.csv
            pjm_probe.json
            miso_lmp_monthly.json
            miso_lmp_monthly.csv
            steo_forward_monthly.json
            steo_forward_monthly.csv
            panel_monthly.csv
            steo_vintages.csv
            status.json
