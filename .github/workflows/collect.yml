name: EIA Harvester
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: EIA monthly retail
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_eia.py
      - name: EIA hourly RTO
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_eia_hourly.py
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eia-result
          path: |
            eia_industrial_prices_monthly.json
            eia_industrial_prices_monthly.csv
            eia_hourly_rto.json
            eia_hourly_rto.csv
      - name: commit back
        run: |
          git config user.name "eia-harvester-bot"
          git config user.email "eia-harvester-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: EIA auto collect" || echo "no change"
          git push || echo "push skip"
